name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Add Android
        run: npx cap add android
      - name: Custom icon (if icon.png exists)
        run: |
          if [ -f icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png
              cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            done
          fi
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: adhkar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
